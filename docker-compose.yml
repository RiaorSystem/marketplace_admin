version: "3.8"
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: betanet
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django_app:
    build: ./django_app
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./django_app:/app
    depends_on:
      - db

  fastapi_app:
    build: ./fastapi_app
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    volumes:
      - ./fastapi_app:/app
    depends_on:
      - db

volumes:
  postgres_data: